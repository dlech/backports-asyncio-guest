name: test

on:
  # Only for changes that can affect the tests: not the README, say.
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'LICENSE'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'LICENSE'
      - '.github/workflows/test.yml'
  workflow_dispatch:
  schedule:
    # Weekly: the package relies on asyncio's private parts, so catch changes
    # in new Python releases and CPython's development branch.
    - cron: '0 6 * * 1'

# A new push to a branch (or pull request) cancels its runs still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, windows-11-arm, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
        experimental: [false]
        include:
          # CPython's development branch: here the tests check the backport's
          # own code (they import it directly), before guest mode lands.
          - {os: ubuntu-latest, python: '3.16-dev', experimental: true}
          - {os: windows-latest, python: '3.16-dev', experimental: true}
          # Free-threaded builds: not yet claimed as supported.
          - {os: ubuntu-latest, python: '3.14t', experimental: true}
          - {os: windows-latest, python: '3.14t', experimental: true}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Install the wheel
        shell: bash
        run: python -m pip install dist/*.whl
      - name: Test the installed wheel
        run: python -X dev -m unittest discover -s tests -v
      - name: Test the installed wheel outside dev mode, so not in debug mode
        run: python -m unittest discover -s tests -v
